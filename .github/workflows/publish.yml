# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ---------------------------------------------------------------------------
# PREREQUISITES
# ---------------------------------------------------------------------------
#
# @n8n/node-cli >= 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `pnpm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   pnpm list @n8n/node-cli
#
# To upgrade:
#
#   pnpm add -D @n8n/node-cli@latest
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP
# ---------------------------------------------------------------------------
#
# npm Automation Token:
#   1. On npmjs.com: Access Tokens -> Generate New Token -> Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings -> Secrets and variables -> Actions -> New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# ---------------------------------------------------------------------------
# TAG CONVENTION
# ---------------------------------------------------------------------------
#
# This workflow triggers on tags matching "v*.*.*" (e.g. v0.1.0, v0.2.0,
# v1.2.3-rc.1). This is the format produced by release-it (see
# .release-it.json) and by `pnpm run release:local`. The repository has no
# published release history yet, so the "v" prefix is adopted from the start.
#
# It can also be run manually from the Actions tab ("Run workflow"), which
# builds and publishes from the latest v*.*.* tag.
#
# ---------------------------------------------------------------------------
# RELEASE PROCESS
# ---------------------------------------------------------------------------
#
# Run the following command locally to start an interactive release:
#
#   pnpm run release:local
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push - which triggers this workflow to publish to npm.
#
# ---------------------------------------------------------------------------
# HOW PUBLISHING WORKS
# ---------------------------------------------------------------------------
#
# `n8n-node release` (which is `pnpm run release`) detects CI (GITHUB_ACTIONS)
# and runs lint, build, then `npm publish` with RELEASE_MODE=true and
# NPM_CONFIG_PROVENANCE=true in the child environment. The RELEASE_MODE env var
# is what allows the `prepublishOnly` guard (`n8n-node prerelease`) to pass -
# without it, the publish step fails by design. The publish uses `--access
# public`, which is required for first-time publication of a scoped package.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      # For manual dispatch, build and publish exactly the code behind the
      # latest v*.*.* tag - never whatever happens to be on the default branch.
      - name: Resolve tag to publish
        id: tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*.*.*' | awk -F/ '{print $NF}' | sort -V | tail -n1)
          if [ -z "$tag" ]; then
            echo "::error::No v*.*.* tag found in the repository."
            exit 1
          fi
          echo "Publishing from tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}

      # Must run before setup-node so the pnpm store cache can be keyed.
      # The pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Check package version matches tag
        run: |
          tag="${{ steps.tag.outputs.tag || github.ref_name }}"
          package_version=$(node -p "require('./package.json').version")
          echo "Tag: $tag, package version: v$package_version"
          if [ "v$package_version" != "$tag" ]; then
            echo "::error::Tag $tag does not match the package.json version v$package_version."
            exit 1
          fi

      - name: Check whether version is already published
        # Read-only registry query. Publishes only when npm explicitly reports
        # the version as not found (E404). A successful query means the version
        # exists (skip). Any other failure (network, auth, registry, malformed
        # response) fails closed - publication is never attempted on unknown
        # state. Query output contains only public registry data.
        id: published
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          # The default GitHub Actions shell runs with `set -e`, so a failing
          # command-substitution assignment would abort the step. Checking the
          # exit status inside an `if` condition (errexit-exempt) prevents that.
          if output="$(npm view "$package_name@$package_version" version 2>&1)"; then
            echo "::warning::$package_name@$package_version is already on npm - skipping publication."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if printf '%s' "$output" | grep -q 'E404'; then
              echo "$package_name@$package_version is not on npm yet (npm reported E404) - proceeding."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::npm view $package_name@$package_version failed with exit code $status (not an E404). Failing closed; refusing to publish without a confirmed not-published state."
              printf '%s\n' "$output"
              exit 1
            fi
          fi

      - name: Verify NPM_TOKEN is configured
        # Fails closed before any authentication or publish attempt is made.
        # The token value is only tested for emptiness and is never printed.
        if: steps.published.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set (or is empty). Publishing requires npm authentication."
            exit 1
          fi
          echo "NPM_TOKEN is configured."

      - name: Publish to npm
        # `n8n-node release` (which is `pnpm run release`) detects CI via
        # GITHUB_ACTIONS and runs: lint + build + `npm publish` with provenance.
        # RELEASE_MODE is what allows the `prepublishOnly` guard
        # (`n8n-node prerelease`) to pass - without it, publication fails by
        # design. NPM_CONFIG_ACCESS has npm treat it as `--access public`,
        # which is required for the first publication of a scoped package.
        # NODE_AUTH_TOKEN is the secret that actions/setup-node writes into the
        # project .npmrc, so the token itself is never written to disk here.
        if: steps.published.outputs.skip == 'false'
        run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'
          NPM_CONFIG_ACCESS: 'public'
